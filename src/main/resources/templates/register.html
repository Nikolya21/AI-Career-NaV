<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | AI Career Nav</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1f2937;
      --secondary: #6b7280;
      --accent: #6ea8ff;
      --accent-strong: #4f83ff;
      --glass: rgba(255, 255, 255, 0.42);
      --border: rgba(255, 255, 255, 0.7);
      --error: #dc5b66;
      --shadow: 0 30px 80px rgba(128, 145, 173, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95) 0%, rgba(247,250,255,0.95) 36%, rgba(237,244,255,0.96) 70%, rgba(248,250,252,1) 100%);
      color: var(--primary);
    }

    .bg-orb { position: fixed; inset: 0; z-index: -1; overflow: hidden; }
    .bg-orb::before {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(92vw, 1180px);
      height: min(92vw, 1180px);
      transform: translate(-50%, -50%);
      background: url('/css/roadmap/img/beetwean2.jpg') center center / contain no-repeat;
      filter: drop-shadow(0 30px 80px rgba(153, 163, 185, 0.24));
      animation: orb-pulse 12s ease-in-out infinite;
    }
    .bg-orb::after {
      content: '';
      position: absolute;
      left: 50%;
      top: 50%;
      width: min(104vw, 1320px);
      height: min(104vw, 1320px);
      transform: translate(-50%, -52%);
      border-radius: 50%;
      background: radial-gradient(circle, rgba(120, 179, 255, 0.20) 0%, rgba(120, 179, 255, 0.10) 28%, rgba(120, 179, 255, 0.03) 52%, transparent 70%);
      filter: blur(18px);
      animation: orb-glow 12s ease-in-out infinite;
    }

    .shadow-blur {
      position: fixed;
      left: 50%;
      bottom: 56px;
      width: 220px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(140, 146, 160, 0.26);
      filter: blur(10px);
      z-index: -1;
      animation: shadow-pulse 12s ease-in-out infinite;
    }

    .login-card {
      position: relative;
      width: min(460px, calc(100vw - 32px));
      text-align: center;
      padding: 52px 42px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.38));
      backdrop-filter: blur(34px) saturate(175%);
      -webkit-backdrop-filter: blur(34px) saturate(175%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }
    .login-card:hover {
      transform: translateY(-3px);
      border-color: rgba(143, 186, 255, 0.72);
      box-shadow: 0 38px 90px rgba(124, 149, 187, 0.22);
    }
    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(160, 198, 255, 0.32), rgba(255,255,255,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.9;
    }
    h1 { color: var(--primary); font-size: 34px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.03em; }
    p.desc { color: var(--secondary); font-size: 15px; margin-bottom: 30px; line-height: 1.55; }
    .input-box { margin-bottom: 14px; text-align: left; }
    input {
      width: 100%;
      padding: 15px 18px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(160, 184, 218, 0.38);
      border-radius: 16px;
      outline: none;
      color: var(--primary);
      font-size: 15px;
      transition: 0.28s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }
    input::placeholder { color: rgba(107, 114, 128, 0.78); }
    input:focus { border-color: rgba(111, 170, 255, 0.9); background: rgba(255, 255, 255, 0.82); box-shadow: 0 0 0 4px rgba(120, 175, 255, 0.16); }
    input.error-field { border-color: rgba(220, 91, 102, 0.9); box-shadow: 0 0 0 4px rgba(220, 91, 102, 0.12); }
    .field-error { color: var(--error); font-size: 11px; margin-top: 5px; padding-left: 5px; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff, #f3f7ff);
      color: #1f2937;
      border: 1px solid rgba(170, 196, 231, 0.38);
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      margin-top: 15px;
      box-shadow: 0 12px 26px rgba(120, 145, 180, 0.14);
    }
    button:hover { background: linear-gradient(180deg, #ffffff, #eaf2ff); color: var(--accent-strong); transform: translateY(-2px); box-shadow: 0 16px 34px rgba(120, 145, 180, 0.18); }
    .footer { margin-top: 22px; font-size: 13px; color: var(--secondary); }
    .footer a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
    .footer a:hover { text-decoration: underline; }
    .global-errors { background: rgba(255, 235, 238, 0.82); border: 1px solid rgba(220, 91, 102, 0.18); padding: 10px 12px; border-radius: 12px; margin-bottom: 15px; color: var(--error); font-size: 13px; backdrop-filter: blur(14px); }

    @keyframes orb-pulse { 0%, 100% { transform: translate(-50%, -50%) scale(0.98); opacity: 0.9; } 50% { transform: translate(-50%, -50%) scale(1.02); opacity: 1; } }
    @keyframes orb-glow { 0%, 100% { transform: translate(-50%, -52%) scale(0.98); opacity: 0.7; } 50% { transform: translate(-50%, -52%) scale(1.03); opacity: 1; } }
    @keyframes shadow-pulse { 0%, 100% { transform: translateX(-50%) scale(0.96); opacity: 0.42; } 50% { transform: translateX(-50%) scale(1.04); opacity: 0.62; } }

    @media (max-width: 520px) {
      .login-card { padding: 42px 22px; border-radius: 28px; }
      h1 { font-size: 29px; }
      p.desc { margin-bottom: 24px; }
    }
  </style>
</head>
<body>
<div class="bg-orb"></div>
<div class="shadow-blur"></div>
<div class="login-card">
  <h1>Создать аккаунт</h1>
  <p class="desc">Присоединяйтесь к AI Career Navigator</p>
  <form th:action="@{/register}" th:object="${userRegistrationDto}" method="POST">
    <div th:if="${#fields.hasErrors('global')}" class="global-errors"><p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p></div>
    <div class="input-box">
      <input type="text" th:field="*{name}" placeholder="Имя" th:classappend="${#fields.hasErrors('name')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="input-box">
      <input type="email" th:field="*{email}" placeholder="Email" th:classappend="${#fields.hasErrors('email')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="input-box">
      <input type="password" th:field="*{password}" placeholder="Пароль" th:classappend="${#fields.hasErrors('password')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>
    <div class="input-box">
      <input type="password" th:field="*{confirmPassword}" placeholder="Повторите пароль" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <div class="footer">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></div>
</div>
</body>
</html>
