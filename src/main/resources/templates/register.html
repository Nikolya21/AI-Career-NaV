<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация | AI Career Nav</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root { --primary: #fff; --accent: #007AFF; --glass: rgba(255, 255, 255, 0.03); --border: rgba(255, 255, 255, 0.1); --error: #ff4444; }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
    .bg-mesh { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.15) 0px, transparent 50%), radial-gradient(at 100% 100%, rgba(88, 86, 214, 0.15) 0px, transparent 50%); z-index: -1; animation: mesh-move 20s ease infinite alternate; }
    @keyframes mesh-move { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    .login-card { background: var(--glass); backdrop-filter: blur(40px) saturate(180%); border: 1px solid var(--border); border-radius: 32px; padding: 50px 40px; width: 440px; text-align: center; transition: 0.4s; }
    .login-card:hover { border-color: rgba(0, 122, 255, 0.4); }
    h1 { color: var(--primary); font-size: 28px; font-weight: 700; margin-bottom: 8px; }
    p.desc { color: rgba(255, 255, 255, 0.5); font-size: 14px; margin-bottom: 30px; }
    .input-box { margin-bottom: 12px; text-align: left; }
    input { width: 100%; padding: 14px 18px; background: rgba(255, 255, 255, 0.05); border: 1px solid var(--border); border-radius: 12px; outline: none; color: #fff; font-size: 15px; transition: 0.3s; }
    input:focus { border-color: var(--accent); }
    input.error-field { border-color: var(--error); }
    .field-error { color: var(--error); font-size: 11px; margin-top: 4px; padding-left: 5px; }
    button { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 15px; }
    button:hover { background: var(--accent); color: #fff; }
    .footer { margin-top: 20px; font-size: 13px; color: rgba(255, 255, 255, 0.4); }
    .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }
    .global-errors { background: rgba(255, 68, 68, 0.1); border: 1px solid var(--error); padding: 10px; border-radius: 10px; margin-bottom: 15px; color: var(--error); font-size: 13px; }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="login-card">
  <h1>Создать аккаунт</h1>
  <p class="desc">Присоединяйтесь к AI Career Nav</p>
  <form th:action="@{/register}" th:object="${userRegistrationDto}" method="POST">
    <div th:if="${#fields.hasErrors('global')}" class="global-errors"><p th:each="err : ${#fields.errors('global')}" th:text="${err}"></p></div>
    <div class="input-box">
      <input type="text" th:field="*{name}" placeholder="Имя" th:classappend="${#fields.hasErrors('name')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>
    <div class="input-box">
      <input type="email" th:field="*{email}" placeholder="Email" th:classappend="${#fields.hasErrors('email')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    </div>
    <div class="input-box">
      <input type="password" th:field="*{password}" placeholder="Пароль" th:classappend="${#fields.hasErrors('password')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
    </div>
    <div class="input-box">
      <input type="password" th:field="*{confirmPassword}" placeholder="Повторите пароль" th:classappend="${#fields.hasErrors('confirmPassword')} ? 'error-field'">
      <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
    </div>
    <button type="submit">Зарегистрироваться</button>
  </form>
  <div class="footer">Уже есть аккаунт? <a th:href="@{/login}">Войти</a></div>
</div>
</body>
</html>
