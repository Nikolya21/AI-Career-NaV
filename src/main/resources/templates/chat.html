<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>AI Career Chat</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #1f2937;
            --secondary: #6b7280;
            --accent: #6ea8ff;
            --accent-strong: #4f83ff;
            --glass: rgba(255, 255, 255, 0.58);
            --border: rgba(255, 255, 255, 0.82);
            --shadow: 0 30px 80px rgba(128, 145, 173, 0.18);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--primary);
            background:
                radial-gradient(circle at 20% 20%, rgba(255,255,255,0.95) 0%, rgba(247,250,255,0.95) 36%, rgba(237,244,255,0.96) 70%, rgba(248,250,252,1) 100%);
            overflow-y: auto;
            overflow-x: hidden;
            padding-top: 40px;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/css/roadmap/img/beetwean2.jpg') center center / min(82vw, 1120px) no-repeat;
            filter: drop-shadow(0 22px 64px rgba(153, 163, 185, 0.16));
            opacity: 0.9;
            animation: orb-pulse 12s ease-in-out infinite;
            pointer-events: none;
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(circle, rgba(120, 179, 255, 0.18) 0%, rgba(120, 179, 255, 0.08) 28%, rgba(120, 179, 255, 0.02) 52%, transparent 70%);
            filter: blur(18px);
            animation: orb-glow 12s ease-in-out infinite;
            pointer-events: none;
            z-index: -1;
        }

        .chat-container {
            width: min(860px, 100%);
            background: linear-gradient(180deg, rgba(255,255,255,0.72), rgba(255,255,255,0.44));
            padding: 28px;
            border-radius: 34px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            backdrop-filter: blur(34px) saturate(175%);
            -webkit-backdrop-filter: blur(34px) saturate(175%);
            position: relative;
        }

        .chat-container::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.92), rgba(160, 198, 255, 0.32), rgba(255,255,255,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.92;
        }

        .back-link {
            text-decoration: none;
            color: var(--secondary);
            font-size: 14px;
            font-weight: 600;
        }

        .back-link:hover { color: var(--accent-strong); }

        .chat-title {
            margin: 10px 0 18px;
            text-align: center;
            color: var(--primary);
            font-size: 30px;
            letter-spacing: -0.03em;
        }

        .chat-box {
            height: 520px;
            border: 1px solid rgba(160, 184, 218, 0.28);
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.58);
            border-radius: 22px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.86);
        }

        .message {
            margin-bottom: 12px;
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 86%;
            line-height: 1.45;
            font-size: 15px;
            backdrop-filter: blur(10px);
        }

        .user {
            align-self: flex-end;
            background: linear-gradient(180deg, #ffffff, #eaf2ff);
            color: var(--primary);
            border: 1px solid rgba(111, 170, 255, 0.22);
            border-bottom-right-radius: 4px;
        }

        .ai {
            align-self: flex-start;
            background: rgba(255, 255, 255, 0.78);
            color: var(--primary);
            border: 1px solid rgba(160, 184, 218, 0.22);
            border-bottom-left-radius: 4px;
        }

        .input-area {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 14px 16px;
            border: 1px solid rgba(160, 184, 218, 0.34);
            border-radius: 18px;
            outline: none;
            background: rgba(255,255,255,0.74);
            color: var(--primary);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.86);
        }

        input::placeholder { color: rgba(107, 114, 128, 0.72); }
        input:focus { border-color: rgba(111, 170, 255, 0.9); box-shadow: 0 0 0 4px rgba(120, 175, 255, 0.16); }

        button {
            padding: 12px 20px;
            border: 1px solid transparent;
            border-radius: 18px;
            cursor: pointer;
            font-weight: 700;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
        }

        .btn-send {
            background: linear-gradient(180deg, #ffffff, #f3f7ff);
            color: var(--primary);
            border-color: rgba(170, 196, 231, 0.38);
            box-shadow: 0 12px 26px rgba(120, 145, 180, 0.12);
        }

        .btn-send:hover {
            transform: translateY(-2px);
            color: var(--accent-strong);
            box-shadow: 0 16px 34px rgba(120, 145, 180, 0.18);
        }

        .summary-wrapper {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid rgba(160, 184, 218, 0.26);
        }

        .btn-summary {
            background: linear-gradient(180deg, #ffffff, #eef4ff);
            color: var(--primary);
            width: 100%;
            border-color: rgba(143, 186, 255, 0.34);
            box-shadow: 0 12px 26px rgba(120, 145, 180, 0.12);
        }

        .btn-summary:hover:not(:disabled) {
            transform: translateY(-2px);
            color: var(--accent-strong);
            box-shadow: 0 16px 34px rgba(120, 145, 180, 0.18);
        }

        .btn-summary:disabled { background: rgba(255,255,255,0.5); color: rgba(31, 41, 55, 0.4); }

        #summaryBox {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.68);
            border-radius: 18px;
            border: 1px solid rgba(160, 184, 218, 0.24);
        }

        .btn-finish {
            background: linear-gradient(180deg, #ffffff, #f3f7ff);
            color: var(--primary);
            margin-top: 10px;
            width: 100%;
            border-color: rgba(170, 196, 231, 0.38);
            box-shadow: 0 12px 26px rgba(120, 145, 180, 0.12);
        }

        .btn-finish:hover { transform: translateY(-2px); color: var(--accent-strong); box-shadow: 0 16px 34px rgba(120, 145, 180, 0.18); }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        @keyframes orb-pulse {
            0%, 100% { transform: scale(0.98); opacity: 0.92; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        @keyframes orb-glow {
            0%, 100% { transform: scale(0.98); opacity: 0.72; }
            50% { transform: scale(1.03); opacity: 1; }
        }

        @media (max-width: 820px) {
            body { padding: 16px; }
            .chat-container { padding: 18px; border-radius: 28px; }
            .chat-box { height: 440px; }
            .chat-title { font-size: 26px; }
            .input-area { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <a id="backLink" class="back-link" href="/wishes/form">← Назад</a>
    <h3 class="chat-title" th:text="${dialogType.name() == 'INFORMATION' ? 'Опрос по целям' : 'Создание плана обучения'}">Чат</h3>

    <div class="chat-box" id="chatBox"></div>

    <div class="input-area">
        <label class="sr-only" for="userInput">Ваше сообщение</label>
        <input type="text" id="userInput" placeholder="Напишите сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" onclick="sendMessage()">➤</button>
    </div>

    <div class="summary-wrapper">
        <button id="summarizeBtn" class="btn-summary" onclick="fetchSummary()">
            ✨ <span th:text="${dialogType.name() == 'INFORMATION' ? 'Сформировать мои желания' : 'Подвести итог для Roadmap'}">Действие</span>
        </button>

        <div id="summaryBox">
            <div id="summaryText" style="white-space: pre-wrap; font-size: 14px; color: #1f2937;"></div>
            <button class="btn-finish" onclick="handleFinish()">
                <span th:text="${dialogType.name() == 'INFORMATION' ? 'Копировать и вернуться к форме' : 'Посмотреть мой план обучения'}">Далее</span>
            </button>
        </div>
    </div>
</div>

<script th:inline="javascript">
    const userId = /*[[${userId}]]*/ null;
    const dialogType = /*[[${dialogType}]]*/ null;

    window.onload = async () => {
        // ОБНОВЛЕНИЕ ССЫЛКИ "НАЗАД"
        if (userId) {
            document.getElementById('backLink').href = `/wishes/form?userId=${userId}`;
        }

        const res = await fetch(`/api/dialogs/history?userId=${userId}&type=${dialogType}`)
        const history = await res.json();

        if (history.length === 0) {
            startNewDialog();
        } else {
            history.forEach(msg => {
                const sep = msg.indexOf(': ');
                if (sep !== -1) {
                    const sender = msg.substring(0, sep);
                    const text = msg.substring(sep + 2);
                    appendMessage(sender === 'AI' ? 'ai' : 'user', text);
                }
            });
        }
    };

    async function startNewDialog() {
        const res = await fetch(`/api/dialogs/start?userId=${userId}&type=${dialogType}`, { method: 'POST' });
        const data = await res.json();
        appendMessage('ai', data.reply);
    }

    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        appendMessage('user', text);
        input.value = '';

        const res = await fetch('/api/dialogs/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ userId, message: text, dialogType })
        });
        const data = await res.json();
        appendMessage('ai', data.reply);
    }

    function appendMessage(type, text) {
        const box = document.getElementById('chatBox');
        const div = document.createElement('div');
        div.className = `message ${type}`;
        div.innerText = text;
        box.appendChild(div);
        box.scrollTop = box.scrollHeight;
    }

    async function fetchSummary() {
        const btn = document.getElementById('summarizeBtn');
        const box = document.getElementById('summaryBox');
        const textDisplay = document.getElementById('summaryText');

        btn.disabled = true;
        btn.innerText = "Минутку, ИИ обрабатывает данные...";

        try {
            const res = await fetch(`/api/dialogs/summarize?userId=${userId}&type=${dialogType}`);
            const data = await res.json();

            // Проверяем, не является ли ответ системным предупреждением о нехватке данных
            const isTooShort = data.summary.includes("Слишком мало данных") ||
                data.summary.includes("История диалога пуста");

            if (isTooShort) {
                // Показываем текст предупреждения, но СКРЫВАЕМ блок с кнопкой перехода
                // (или только саму кнопку перехода)
                textDisplay.innerHTML = `<span style="color: #856404;">${data.summary}</span>`;
                box.style.display = "block"; // Показываем желтую плашку с текстом

                // Находим кнопку перехода внутри блока и скрываем её
                const finishBtn = box.querySelector('button');
                if (finishBtn) finishBtn.style.display = "none";

                btn.innerText = "Попробовать снова";
            } else {
                // Если данных достаточно — показываем всё
                textDisplay.innerText = data.summary;
                box.style.display = "block";

                const finishBtn = box.querySelector('button');
                if (finishBtn) finishBtn.style.display = "block";

                btn.innerText = "Обновить результат";
            }
        } catch (e) {
            alert("Ошибка при создании резюме");
            btn.innerText = "Попробовать снова";
        } finally {
            btn.disabled = false;
        }
    }

    function handleFinish() {
        const text = document.getElementById('summaryText').innerText;

        if (dialogType === 'INFORMATION') {
            navigator.clipboard.writeText(text).then(() => {
                alert("Резюме скопировано! Сейчас вы вернетесь к форме.");
                // Добавляем userId и сюда
                window.location.href = `/wishes/form?userId=${userId}`;
            });
        } else {
            // Для ROADMAP — идем на страницу результата
            window.location.href = `/roadmap/${userId}`;
        }
    }
</script>

</body>
</html>
