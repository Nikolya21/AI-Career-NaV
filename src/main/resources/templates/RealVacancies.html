<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Реальные вакансии - Career Navigator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      background: linear-gradient(135deg, #f5f7fa 0%, #e4ebf5 50%, #d1def0 100%);
      color: #1e293b;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
      radial-gradient(circle at 80% 20%, rgba(236, 72, 153, 0.1) 0%, transparent 50%);
      z-index: 0; pointer-events: none;
    }

    .header {
      position: relative; z-index: 10;
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.25rem 2.5rem;
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    .logo h1 {
      font-size: 1.5rem; font-weight: 700;
      background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    .main-container { position: relative; z-index: 5; max-width: 1100px; margin: 0 auto; padding: 2rem 1.5rem; }

    .back-btn {
      display: inline-flex; align-items: center; gap: 0.5rem;
      padding: 0.75rem 1.5rem; background: rgba(255, 255, 255, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.8); border-radius: 12px;
      color: #475569; text-decoration: none; margin-bottom: 2rem; transition: 0.3s;
    }
    .back-btn:hover { background: #fff; transform: translateX(-5px); }

    .vacancies-header { text-align: center; margin-bottom: 2rem; }
    .vacancies-header h2 { font-size: 2.2rem; font-weight: 800; color: #0f172a; }
    .vacancy-count { background: #e2e8f0; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.85rem; font-weight: 600; }

    .test-btn-white {
      display: inline-flex; align-items: center; gap: 0.75rem;
      padding: 1rem 2rem; background: linear-gradient(135deg, #4f46e5, #7c3aed);
      border-radius: 60px; color: white; font-weight: 700; text-decoration: none;
      transition: 0.3s; box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .info-box {
      background: rgba(255, 255, 255, 0.6); backdrop-filter: blur(10px);
      border: 1px solid #fff; border-radius: 16px; padding: 1.5rem;
      margin-bottom: 2rem; display: flex; gap: 1rem; box-shadow: 0 10px 25px rgba(0,0,0,0.03);
    }

    .vacancy-card {
      background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.9); border-radius: 24px;
      padding: 2rem; margin-bottom: 1.5rem; transition: 0.3s;
    }
    .vacancy-card:hover { transform: translateY(-5px); background: #fff; border-color: rgba(99, 102, 241, 0.3); }

    .vacancy-title { font-size: 1.4rem; font-weight: 700; color: #1e293b; margin-bottom: 0.5rem; }
    .vacancy-salary { font-size: 1.2rem; font-weight: 600; color: #059669; margin-bottom: 1.2rem; }

    .vacancy-details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }
    .detail-item { background: #f8fafc; padding: 1rem; border-radius: 12px; border-left: 3px solid #6366f1; }
    .detail-label { display: block; font-size: 0.7rem; color: #64748b; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; }
    .detail-value { font-size: 1rem; font-weight: 600; }

    .vacancy-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid rgba(0,0,0,0.05); }
    .badge { padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.75rem; font-weight: 700; }

    /* Стили для разных источников */
    .badge-hh { background: #e2e8f0; color: #475569; }
    .badge-habr { background: #6366f1; color: white; }

    .apply-btn { padding: 0.7rem 1.5rem; background: #10b981; border: none; border-radius: 10px; color: white; font-weight: 600; cursor: pointer; transition: 0.3s; }
    .apply-btn:hover { background: #059669; transform: translateY(-2px); }

    .loader-container { text-align: center; padding: 4rem; }
    .spinner { width: 40px; height: 40px; border: 4px solid rgba(99, 102, 241, 0.1); border-left-color: #6366f1; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="header">
  <a th:href="@{/personal-cabinet}" class="cabinet-btn" style="text-decoration:none; color:inherit;">👤 Кабинет</a>
  <div class="logo"><h1>Career Navigator</h1></div>
  <div class="user-info">
    <span id="userEmail" class="user-email">Загрузка...</span>
    <a th:href="@{/logout}" class="logout-btn">Выйти</a>
  </div>
</div>

<div class="main-container">
  <a th:href="@{/choose-vacancy}" class="back-btn">← К выбору профессии</a>

  <div class="vacancies-header">
    <h2 id="titleText">Реальные вакансии</h2>
    <p id="vacancyInfo"></p>
  </div>

  <div class="test-button-wrapper" style="text-align:center; margin-bottom: 2rem;">
    <a th:href="@{'/quiz-view/' + ${session.userId}}" class="test-btn-white">📝 Пройти тест на профориентацию</a>
  </div>

  <div class="info-box">
    <div style="font-size: 1.5rem;">💡</div>
    <div>
      <h4>Анализ рынка</h4>
      <p>Мы собрали предложения с HH.ru и Хабр Карьеры, чтобы вы видели полную картину.</p>
    </div>
  </div>

  <div id="vacancies-container">
    <div class="loader-container">
      <div class="spinner"></div>
      <p>Ищем лучшие вакансии для вас...</p>
    </div>
  </div>
</div>

<script>
  const urlParams = new URLSearchParams(window.location.search);
  let selectedVacancy = urlParams.get('vacancy') || sessionStorage.getItem('selectedVacancy') || "Java Developer";

  document.getElementById('vacancyInfo').innerHTML = `По профессии: <strong>${selectedVacancy}</strong> <span class="vacancy-count" id="vacancyCount"></span>`;
  document.getElementById('userEmail').textContent = sessionStorage.getItem('userEmail') || 'Пользователь';

  async function loadRealVacancies() {
    const container = document.getElementById('vacancies-container');
    try {
      const response = await fetch(`/api/v1/vacancies?searchText=${encodeURIComponent(selectedVacancy)}&area=1&perPage=10`);
      if (!response.ok) throw new Error('Ошибка связи с сервером');

      const vacancies = await response.json();
      document.getElementById('vacancyCount').textContent = vacancies.length;

      if (vacancies.length === 0) {
        container.innerHTML = `<div style="text-align:center; padding: 2rem;">Вакансии временно недоступны. Попробуйте позже.</div>`;
        return;
      }

      container.innerHTML = vacancies.map(v => {
        // Определяем источник по тексту в названии, который мы добавили в ParserService
        const isHabr = v.nameOfVacancy.includes('[Habr]');
        const isMock = v.nameOfVacancy.includes('(Резервный)');

        const sourceLabel = isHabr ? 'Habr Career' : (isMock ? 'Локальный поиск' : 'HH.ru');
        const badgeClass = isHabr ? 'badge-habr' : 'badge-hh';

        // Убираем технические пометки из заголовка для красоты
        const displayTitle = v.nameOfVacancy.replace(/\[Habr\]|\[HH\.ru\]|\(Резервный канал\)/g, '').trim();

        return `
          <div class="vacancy-card">
            <div class="vacancy-title">${escapeHtml(displayTitle)}</div>
            <div class="vacancy-salary">💰 ${v.salary || 'Зарплата по договоренности'}</div>

            <div class="vacancy-details-grid">
              <div class="detail-item">
                <span class="detail-label">Компания</span>
                <span class="detail-value">${escapeHtml(v.employer || 'Не указана')}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">Опыт</span>
                <span class="detail-value">${escapeHtml(v.experience || 'Не указан')}</span>
              </div>
            </div>

            <div class="requirements-title" style="margin-top: 1rem; font-weight: 700; font-size: 0.9rem;">Навыки:</div>
            <div style="display: flex; flex-wrap: wrap; gap: 8px; margin-top: 0.5rem;">
              ${renderSkills(v.vacancyRequirements)}
            </div>

            <div class="vacancy-meta">
              <div class="company-info">
                <span class="badge ${badgeClass}">${sourceLabel}</span>
              </div>
              <button class="apply-btn" onclick="applyToVacancy('${escapeHtml(displayTitle)}')">Откликнуться</button>
            </div>
          </div>
        `;
      }).join('');
    } catch (error) {
      container.innerHTML = `<div style="color:red; text-align:center;">Ошибка: ${error.message}</div>`;
    }
  }

  function renderSkills(skills) {
    if (!skills || skills.length === 0) return '<span style="font-size: 0.8rem; color: #94a3b8;">Уточняйте в описании</span>';
    return skills.map(s => `<span style="background: rgba(99, 102, 241, 0.1); color: #4f46e5; padding: 4px 10px; border-radius: 6px; font-size: 0.8rem; font-weight: 600;">${escapeHtml(s)}</span>`).join('');
  }

  function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
  }

  function applyToVacancy(name) {
    alert(`Переход к вакансии "${name}"...`);
  }

  loadRealVacancies();
</script>
</body>
</html>
