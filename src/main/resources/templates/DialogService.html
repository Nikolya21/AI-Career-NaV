<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Диалог - AI Career Navigator</title>
  <link href="https://fonts.googleapis.com" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b22;
      --text-color: #e6edf3;
      --accent-color: #2f81f7;
      --secondary-text: #8b949e;
      --border-color: #30363d;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Шапка */
    header {
      padding: 1rem 2rem;
      border-bottom: 1px solid var(--border-color);
      background-color: rgba(22, 27, 34, 0.8);
      backdrop-filter: blur(10px);
    }

    header h1 {
      margin: 0;
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--accent-color);
    }

    /* Область сообщений */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 800px;
      margin: 0 auto;
      width: 100%;
    }

    .message {
      padding: 1rem 1.25rem;
      border-radius: 12px;
      line-height: 1.5;
      max-width: 85%;
      word-wrap: break-word;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Подвал с формой */
    .input-area {
      padding: 1.5rem 2rem;
      background-color: var(--bg-color);
      border-top: 1px solid var(--border-color);
    }

    .form-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      gap: 0.75rem;
      position: relative;
    }

    input[type="text"] {
      flex: 1;
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus {
      border-color: var(--accent-color);
    }

    button {
      background-color: var(--accent-color);
      color: white;
      border: none;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    button:hover {
      opacity: 0.9;
    }

    /* Стилизация скроллбара */
    .chat-container::-webkit-scrollbar { width: 6px; }
    .chat-container::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 10px; }
  </style>
</head>
<body>

<header>
  <h1>AI Career Navigator / Диалог</h1>
</header>

<div class="chat-container">
  <!-- Если история пуста -->
  <div th:if="${#lists.isEmpty(discussionHistory)}" style="text-align: center; color: var(--secondary-text); margin-top: 2rem;">
    Начните диалог с AI ассистентом...
  </div>

  <!-- Список сообщений -->
  <div th:each="msg : ${discussionHistory}" class="message">
    <div th:text="${msg}">Текст сообщения</div>
  </div>
</div>

<div class="input-area">
  <form th:action="@{/vacancy-discussion}" method="post" class="form-wrapper">
    <input type="text" name="message" placeholder="Введите ваше сообщение..." required autocomplete="off">
    <button type="submit">Отправить</button>
  </form>
</div>

<script>
  // Автоматическая прокрутка вниз при загрузке
  const container = document.querySelector('.chat-container');
  container.scrollTop = container.scrollHeight;
</script>

</body>
</html>
