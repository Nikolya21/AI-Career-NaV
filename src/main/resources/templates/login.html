<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | AI Career Nav</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1f2937;
      --secondary: #6b7280;
      --accent: #3b82f6;
      --accent-strong: #2563eb;
      --glass: rgba(255, 255, 255, 0.42);
      --glass-strong: rgba(255, 255, 255, 0.58);
      --border: rgba(255, 255, 255, 0.7);
      --shadow: 0 30px 80px rgba(128, 145, 173, 0.22);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background: #ffffff;
      color: var(--primary);
      position: relative;
    }

    /* фоновая картинка – увеличенный масштаб */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: url('/css/roadmap/img/beetwean2.jpg') center center / auto 130% no-repeat; /* увеличено */
      opacity: 0.12;
      pointer-events: none;
      z-index: 0;
      animation: orb-pulse 12s ease-in-out infinite;
    }

    body::after {
      display: none;
    }

    .shadow-blur {
      position: fixed;
      left: 50%;
      bottom: 56px;
      width: 220px;
      height: 28px;
      transform: translateX(-50%);
      border-radius: 50%;
      background: rgba(140, 146, 160, 0.26);
      filter: blur(10px);
      z-index: -1;
      animation: shadow-pulse 12s ease-in-out infinite;
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: min(440px, calc(100vw - 32px));
      text-align: center;
      padding: 60px 46px;
      border-radius: 34px;
      background: linear-gradient(180deg, rgba(255,255,255,0.62), rgba(255,255,255,0.38));
      backdrop-filter: blur(34px) saturate(175%);
      -webkit-backdrop-filter: blur(34px) saturate(175%);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
    }

    .login-card:hover {
      transform: translateY(-3px);
      border-color: rgba(59, 130, 246, 0.72);
      box-shadow: 0 38px 90px rgba(124, 149, 187, 0.22);
    }

    .login-card::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1px;
      background: linear-gradient(145deg, rgba(255,255,255,0.9), rgba(59, 130, 246, 0.32), rgba(255,255,255,0.3));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
      opacity: 0.9;
    }

    h1 { color: var(--primary); font-size: 34px; font-weight: 700; margin-bottom: 10px; letter-spacing: -0.03em; }
    p.desc { color: var(--secondary); font-size: 15px; margin-bottom: 34px; line-height: 1.55; }

    .input-box { position: relative; margin-bottom: 20px; }
    input {
      width: 100%;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.66);
      border: 1px solid rgba(160, 184, 218, 0.38);
      border-radius: 16px;
      outline: none;
      color: var(--primary);
      font-size: 16px;
      transition: 0.28s ease;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.85);
    }
    input::placeholder { color: rgba(107, 114, 128, 0.78); }
    input:focus {
      border-color: rgba(59, 130, 246, 0.9);
      background: rgba(255, 255, 255, 0.82);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
    }

    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(180deg, #ffffff, #f3f7ff);
      color: #1f2937;
      border: 1px solid rgba(59, 130, 246, 0.38);
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
      box-shadow: 0 12px 26px rgba(59, 130, 246, 0.14);
    }
    button:hover {
      background: linear-gradient(180deg, #ffffff, #eaf2ff);
      color: var(--accent-strong);
      transform: translateY(-2px);
      box-shadow: 0 16px 34px rgba(59, 130, 246, 0.18);
    }

    .footer { margin-top: 28px; font-size: 13px; color: var(--secondary); }
    .footer a { color: var(--accent-strong); text-decoration: none; font-weight: 700; }
    .footer a:hover { text-decoration: underline; }

    .error-msg, .success-msg {
      margin-bottom: 16px;
      font-size: 14px;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid transparent;
      backdrop-filter: blur(14px);
    }
    .error-msg { color: #c2414c; background: rgba(255, 235, 238, 0.78); border-color: rgba(239, 68, 68, 0.18); }
    .success-msg { color: #15803d; background: rgba(236, 253, 245, 0.78); border-color: rgba(34, 197, 94, 0.18); }

    @keyframes orb-pulse {
      0%, 100% { transform: scale(0.98); opacity: 0.9; }
      50% { transform: scale(1.02); opacity: 1; }
    }

    @keyframes shadow-pulse {
      0%, 100% { transform: translateX(-50%) scale(0.96); opacity: 0.42; }
      50% { transform: translateX(-50%) scale(1.04); opacity: 0.62; }
    }

    @media (max-width: 520px) {
      .login-card { padding: 44px 22px; border-radius: 28px; }
      h1 { font-size: 29px; }
      p.desc { margin-bottom: 26px; }
    }
  </style>
</head>
<body>
<div class="shadow-blur"></div>
<div class="login-card">
  <h1>С возвращением</h1>
  <p class="desc">Введите данные для входа в систему</p>
  <div th:if="${registered}" class="success-msg">Регистрация успешна! Войдите.</div>
  <div th:if="${param.error}" class="error-msg">Неверный email или пароль.</div>
  <form th:action="@{/login}" method="POST">
    <div class="input-box"><input type="email" name="email" placeholder="Email" required></div>
    <div class="input-box"><input type="password" name="password" placeholder="Пароль" required></div>
    <button type="submit">Продолжить</button>
  </form>
  <div class="footer">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></div>
</div>
</body>
</html>
