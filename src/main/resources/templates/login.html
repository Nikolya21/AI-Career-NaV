<!DOCTYPE html>
<html lang="ru" xmlns:th="http://thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход | AI Career Nav</title>
  <link href="https://googleapis.com" rel="stylesheet">
  <style>
    :root {
      --primary: #ffffff;
      --accent: #007AFF;
      --glass: rgba(255, 255, 255, 0.03);
      --border: rgba(255, 255, 255, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
    body { height: 100vh; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }

    .bg-mesh {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background:
          radial-gradient(at 0% 0%, rgba(0, 122, 255, 0.15) 0px, transparent 50%),
          radial-gradient(at 100% 100%, rgba(88, 86, 214, 0.15) 0px, transparent 50%),
          radial-gradient(at 50% 0%, rgba(236, 72, 153, 0.05) 0px, transparent 50%);
      z-index: -1;
      animation: mesh-move 20s ease infinite alternate;
    }
    @keyframes mesh-move { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }

    .login-card {
      background: var(--glass);
      backdrop-filter: blur(40px) saturate(180%);
      border: 1px solid var(--border);
      border-radius: 32px;
      padding: 60px 45px;
      width: 420px;
      text-align: center;
      transition: all 0.4s ease;
    }
    .login-card:hover { border-color: rgba(0, 122, 255, 0.4); box-shadow: 0 0 40px rgba(0, 122, 255, 0.1); }

    h1 { color: var(--primary); font-size: 32px; font-weight: 700; margin-bottom: 8px; letter-spacing: -1px; }
    p.desc { color: rgba(255, 255, 255, 0.5); font-size: 15px; margin-bottom: 40px; }

    .input-box { position: relative; margin-bottom: 20px; }
    input {
      width: 100%; padding: 16px 20px; background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border); border-radius: 14px; outline: none;
      color: #fff; font-size: 16px; transition: 0.3s;
    }
    input:focus { border-color: var(--accent); background: rgba(255, 255, 255, 0.1); }

    button {
      width: 100%; padding: 16px; background: #fff; color: #000; border: none;
      border-radius: 14px; font-size: 16px; font-weight: 600; cursor: pointer; transition: 0.3s;
    }
    button:hover { background: var(--accent); color: #fff; transform: translateY(-2px); }

    .footer { margin-top: 30px; font-size: 13px; color: rgba(255, 255, 255, 0.4); }
    .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

    .error-msg { color: #ff4444; margin-bottom: 15px; font-size: 14px; background: rgba(255, 68, 68, 0.1); padding: 10px; border-radius: 8px; border: 1px solid #ff4444; }
    .success-msg { color: #00ff00; margin-bottom: 15px; font-size: 14px; background: rgba(0, 255, 0, 0.1); padding: 10px; border-radius: 8px; border: 1px solid #00ff00; }
  </style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="login-card">
  <h1>С возвращением</h1>
  <p class="desc">Введите данные для входа в систему</p>
  <div th:if="${registered}" class="success-msg">Регистрация успешна! Войдите.</div>
  <div th:if="${param.error}" class="error-msg">Неверный email или пароль.</div>
  <form th:action="@{/login}" method="POST">
    <div class="input-box"><input type="email" name="email" placeholder="Email" required></div>
    <div class="input-box"><input type="password" name="password" placeholder="Пароль" required></div>
    <button type="submit">Продолжить</button>
  </form>
  <div class="footer">Нет аккаунта? <a th:href="@{/register}">Зарегистрироваться</a></div>
</div>
</body>
</html>
