<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ML‑собеседование | AI Career Nav</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .interview-card {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 40px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
      background: linear-gradient(135deg, #fff, #a5b4fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sub {
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 2rem;
      font-size: 0.95rem;
    }

    .video-container {
      background: #000;
      border-radius: 28px;
      overflow: hidden;
      aspect-ratio: 16 / 9;
      margin-bottom: 1.5rem;
      border: 1px solid rgba(255, 255, 255, 0.2);
      position: relative;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1); /* зеркальное отображение для естественного вида */
    }

    .placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.2rem;
      flex-direction: column;
      gap: 12px;
    }

    .controls {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 10px;
    }

    button {
      padding: 14px 32px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 1rem;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      background: rgba(255, 255, 255, 0.1);
      color: white;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    button.primary {
      background: linear-gradient(135deg, #007AFF, #5856d6);
      border: none;
      box-shadow: 0 8px 20px rgba(0, 122, 255, 0.3);
    }

    button.primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px rgba(0, 122, 255, 0.4);
    }

    button:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .status-message {
      margin-top: 20px;
      font-size: 0.85rem;
      color: rgba(255, 255, 255, 0.7);
      background: rgba(0, 0, 0, 0.4);
      padding: 10px;
      border-radius: 40px;
      display: inline-block;
    }

    .error {
      color: #ff6b6b;
    }
  </style>
</head>
<body>

<div class="interview-card">
  <h1>🤖 ML‑собеседование</h1>
  <div class="sub">Включите камеру и микрофон. ИИ‑ассистент задаст вам вопросы.</div>

  <div class="video-container" id="videoContainer">
    <video id="localVideo" autoplay playsinline muted></video>
    <div id="videoPlaceholder" class="placeholder" style="display: none;">
      📷 Камера не активна
    </div>
  </div>

  <div class="controls">
    <button id="startCamBtn">🎥 Включить камеру</button>
    <button id="startInterviewBtn" class="primary" disabled>🚀 Начать интервью</button>
  </div>

  <div id="statusMessage" class="status-message">⚠️ Нажмите «Включить камеру» и разрешите доступ.</div>
</div>

<script>
  (function() {
    const video = document.getElementById('localVideo');
    const startCamBtn = document.getElementById('startCamBtn');
    const startInterviewBtn = document.getElementById('startInterviewBtn');
    const statusDiv = document.getElementById('statusMessage');
    const placeholder = document.getElementById('videoPlaceholder');
    let stream = null;
    let cameraActive = false;

    // Запрос доступа к камере
    async function enableCamera() {
      try {
        if (stream) {
          stopTracks();
        }
        const constraints = { video: true, audio: true }; // запрашиваем и микрофон (для будущего использования)
        stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.style.display = 'block';
        placeholder.style.display = 'none';
        cameraActive = true;
        statusDiv.innerHTML = '✅ Камера готова. Нажмите «Начать интервью».';
        startInterviewBtn.disabled = false;
        startCamBtn.textContent = '🔄 Сменить камеру';
      } catch (err) {
        console.error('Ошибка доступа к камере:', err);
        statusDiv.innerHTML = '❌ Не удалось получить доступ к камере/микрофону. Проверьте разрешения.';
        startInterviewBtn.disabled = true;
        cameraActive = false;
        video.style.display = 'none';
        placeholder.style.display = 'flex';
      }
    }

    function stopTracks() {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
    }

    // Начать интервью — переход на страницу вопросов или запуск диалога
    function startInterview() {
      if (!cameraActive) {
        statusDiv.innerHTML = '⚠️ Сначала включите камеру.';
        return;
      }
      // Здесь можно отправить видеопоток на сервер или перейти к следующему этапу
      statusDiv.innerHTML = '🎙️ Интервью началось. ИИ задаёт первый вопрос...';
      // Пример: перенаправление на страницу диалога через 1 секунду
      setTimeout(() => {
        // Переход на страницу диалога (можно передать параметры)
        window.location.href = '/ml-interview/start';
      }, 1000);
    }

    startCamBtn.addEventListener('click', enableCamera);
    startInterviewBtn.addEventListener('click', startInterview);

    // При загрузке страницы пробуем включить камеру автоматически (опционально)
    // enableCamera(); // раскомментировать, если нужно сразу запрашивать
  })();
</script>
</body>
</html>
