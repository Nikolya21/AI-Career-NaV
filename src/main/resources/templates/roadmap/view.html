<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${jobTitle}">Roadmap View</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/roadmap/roadmap-style.css}">
    <link rel="stylesheet" th:href="@{/css/roadmap/sidebar.css}">

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<div class="bg-wrapper">
    <div class="bg-layer layer-1"></div>
    <div class="bg-layer layer-2"></div>
    <div class="bg-overlay"></div>
</div>

<div id="roadmap-container"></div>

<div class="header-panel">
    <span th:text="${jobTitle}" style="font-weight: 500;">Вакансия</span>
    <div class="progress-container">
        <div class="progress-track">
            <div id="progress-fill" class="progress-fill" th:style="'width:' + ${progress} + '%'"></div>
        </div>
        <span id="progress-percentage" th:text="${progress} + '%'">0%</span>
    </div>
</div>

<!-- МОДАЛКА 1: Уточнение темы (Уже была) -->
<div id="deepen-modal" class="modal hidden">
    <div class="modal-content deepen-modal-glass">
        <div class="modal-logo-container">
            <img th:src="@{/images/main.jpg}" alt="Logo" class="pulse-logo">
        </div>

        <h3>Уточнение темы</h3>
        <div class="input-wrapper">
            <textarea id="deepen-input" placeholder="Напишите, что именно вы хотите изучить подробнее..."></textarea>
        </div>
        <div class="modal-actions">
            <button onclick="closeDeepenModal()" class="btn-secondary">Отмена</button>
            <button id="confirm-deepen-btn" class="btn-primary">Углубиться</button>
        </div>
    </div>
</div>

<!-- МОДАЛКА 2: Фидбек (НОВАЯ) -->
<div id="feedback-modal" class="modal hidden">
    <div class="modal-content deepen-modal-glass">
        <h3>Как тебе обучение?</h3>
        <div class="input-wrapper">
            <!-- id сохранен для совместимости с JS -->
            <textarea id="lesson-feedback-input" placeholder="Добавь пожелания..."></textarea>
        </div>
        <div class="modal-actions">
            <button onclick="sidebarManager.closeFeedbackModal()" class="btn-secondary">Отмена</button>
            <button id="send-feedback-btn" onclick="sidebarManager.sendFeedback()" class="btn-primary">Отправить</button>
        </div>
        <div id="feedback-status" class="hidden" style="margin-top: 15px; color: #34A853; font-weight: 500;">
            Спасибо! Твои пожелания учтены 🚀
        </div>
    </div>
</div>

<div id="global-loader" class="hidden">
    <div class="spinner"></div>
    <p>ИИ строит новый маршрут...</p>
</div>

<!-- САЙДБАР -->
<div id="sidebar" class="sidebar-hidden">
    <div class="sidebar-controls">
        <button id="fullscreen-btn" class="control-btn close-style" onclick="sidebarManager.toggleFullScreen()">
            <span class="material-icons">open_in_full</span>
        </button>
        <button class="control-btn close-style" onclick="sidebarManager.toggle(false)">
            <span class="material-icons">close</span>
        </button>
    </div>

    <div class="sidebar-content">
        <h2 id="sidebar-title">Загрузка...</h2>
        <p id="sidebar-description">Выберите тему для изучения</p>

        <div id="lesson-list-container">
            <div id="lessons-list"></div>
        </div>

        <div id="lesson-detail-container" class="hidden">
            <button class="back-btn" onclick="sidebarManager.showList()">
                <span class="material-icons">arrow_back</span> К списку уроков
            </button>

            <div id="theory-content" class="markdown-body"></div>

            <div class="lesson-actions">
                <button class="btn-deepen" onclick="deepenManager.openModal()">
                    ✨ Углубиться в тему
                </button>
            </div>

            <!-- СЕКЦИЯ ФИДБЕКА (ОБНОВЛЕННАЯ) -->
            <div class="feedback-section-new">
                <span class="feedback-trigger-text"
                      onclick="sidebarManager.openFeedbackModal()"
                      title="здесь ты можешь сделать свое обучение чуть приятней:)">
                    Как тебе обучение?
                </span>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.roadmapId = [[${roadmapId}]];
    window.jobTitle = [[${jobTitle}]];
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script th:src="@{/js/roadmap-graph.js}"></script>
<script th:src="@{/js/sidebar-manager.js}"></script>
<script th:src="@{/js/deepen-manager.js}"></script>

</body>
</html>
