<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${jobTitle}">Roadmap View</title>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/roadmap/roadmap-style.css}">
    <link rel="stylesheet" th:href="@{/css/roadmap/sidebar.css}">

    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
</head>
<body>

<div id="roadmap-container"></div>

<div class="header-panel">
    <span th:text="${jobTitle}" style="font-weight: 500;">Вакансия</span>
    <div class="progress-track">
        <div class="progress-fill" th:style="'width:' + ${progress} + '%'"></div>
    </div>
    <span th:text="${progress} + '%'">0%</span>
</div>

<div id="deepen-modal" class="modal hidden">
    <div class="modal-content">
        <h4>Уточнение темы</h4>
        <p>Что именно вы хотите изучить подробнее в этом блоке?</p>
        <textarea id="deepen-input" placeholder="Например: хочу больше примеров на Spring Security..."></textarea>
        <div class="modal-actions">
            <button onclick="closeDeepenModal()" class="btn-secondary">Отмена</button>
            <button id="confirm-deepen-btn" class="btn-primary">Создать этап</button>
        </div>
    </div>
</div>

<div id="global-loader" class="hidden">
    <div class="spinner"></div>
    <p>ИИ строит новый маршрут...</p>
</div>

<div id="sidebar" class="sidebar-hidden">
    <div class="sidebar-content">
        <div class="sidebar-header">
            <h2 id="sidebar-title">Загрузка...</h2>
            <button onclick="sidebarManager.toggle(false)" class="close-btn">
                <span class="material-icons">close</span>
            </button>
        </div>

        <div id="lesson-list-container"></div>

        <div id="lesson-detail-container" class="hidden">
            <button class="back-btn" onclick="sidebarManager.showList()">
                <span class="material-icons">arrow_back</span> К списку уроков
            </button>
            <div id="theory-content"></div>

            <div class="lesson-actions">
                <button class="btn-deepen" onclick="deepenManager.openModal()">
                    <span class="material-icons">psychology</span> Углубиться в тему
                </button>
            </div>
            <div class="feedback-section">
                <p class="feedback-label">Как тебе обучение? Можешь написать мне, чего тебе не хватает и т.д.</p>
                <div class="feedback-input-group">
                    <textarea id="lesson-feedback-input" placeholder="Например: добавь больше примеров кода для этого раздела..."></textarea>
                    <button id="send-feedback-btn" class="btn-feedback" onclick="sidebarManager.sendFeedback()">
                        <span class="material-icons">send</span>
                        Отправить фидбек
                    </button>
                </div>
                <div id="feedback-status" class="hidden">Спасибо! Твои пожелания учтены 🚀</div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    window.roadmapId = [[${roadmapId}]];
    window.jobTitle = [[${jobTitle}]];
</script>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

<script th:src="@{/js/roadmap-graph.js}"></script>
<script th:src="@{/js/sidebar-manager.js}"></script>
<script th:src="@{/js/deepen-manager.js}"></script>
</body>
</html>
