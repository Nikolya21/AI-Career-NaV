<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${checkpoint.title}">Урок</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script th:inline="javascript">
        window.roadmapId = [[${roadmapId}]];
    </script>
    <script src="/js/lesson-manager.js"></script>

    <style>
        :root { --google-blue: #1A73E8; }
        body { font-family: 'Roboto', sans-serif; color: #3C4043; line-height: 1.6; margin: 0; display: flex; background: #F8F9FA; }
        .sidebar { width: 300px; border-right: 1px solid #E8EAED; height: 100vh; padding: 20px; overflow-y: auto; background: white; position: sticky; top: 0; }
        .content { flex: 1; padding: 40px 100px; overflow-y: auto; }

        .theory-card { background: #FFFFFF; border: 1px solid #DADCE0; border-radius: 8px; padding: 32px; margin-bottom: 24px; }
        .theory-content { font-size: 16px; color: #3C4043; }

        /* Стили для Markdown кода */
        pre { background: #f1f3f4; padding: 16px; border-radius: 8px; overflow-x: auto; }
        code { font-family: 'Roboto Mono', monospace; color: #d93025; }

        .resource-link { display: inline-flex; align-items: center; padding: 8px 16px; border: 1px solid #DADCE0; border-radius: 20px; text-decoration: none; color: var(--google-blue); margin: 5px; font-size: 14px; }
        .btn-back { color: #5F6368; text-decoration: none; display: flex; align-items: center; margin-bottom: 24px; font-weight: 500; }

        #global-loader {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(255,255,255,0.9); z-index:1000; align-items:center; justify-content:center; flex-direction:column;
        }
    </style>
</head>
<body>

<div id="global-loader">
    <div class="spinner" style="border: 4px solid #f3f3f3; border-top: 4px solid var(--google-blue); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite;"></div>
    <p style="margin-top:15px; font-weight:500;">ИИ создает новый этап обучения...</p>
</div>

<div class="sidebar">
    <a th:href="@{/roadmap/{id}(id=${roadmapId})}" class="btn-back">
        <span class="material-icons">arrow_back</span> Назад к карте
    </a>
    <h3 th:text="${checkpoint.title}">Название темы</h3>
    <p style="font-size: 14px; color: #70757A;" th:text="${checkpoint.description}"></p>
</div>

<div class="content">
    <h1 th:text="${module.title}" style="font-weight: 400; margin-bottom: 32px;">Загрузка...</h1>

    <div th:each="lesson : ${module.lessons}" class="theory-card">
        <h2 th:text="${lesson.title}" style="margin-top:0;"></h2>

        <div class="theory-content" th:text="${lesson.theory.text}"></div>

        <div style="margin-top: 24px; border-top: 1px solid #eee; padding-top: 16px;">
            <p style="font-weight:500; margin-bottom:10px;">Материалы для изучения:</p>
            <a th:each="res : ${lesson.theory.resources}"
               th:href="${res.url}" class="resource-link" target="_blank">
                <span class="material-icons" style="font-size: 18px; margin-right: 8px;">link</span>
                <span th:text="${res.title}"></span>
            </a>
        </div>
    </div>

    <div style="text-align: center; margin-top: 40px; padding-bottom: 60px;">
        <button th:onclick="'requestDeepen(' + ${checkpoint.id} + ')'"
                style="background: var(--google-blue); color: white; border: none; padding: 12px 32px; border-radius: 24px; cursor: pointer; font-size: 16px; box-shadow: 0 2px 6px rgba(26,115,232,0.3);">
            Хочу изучить эту тему подробнее
        </button>
    </div>
</div>

<style>
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>

</body>
</html>
