<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Твой План Обучения</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .sidebar { height: 100vh; overflow-y: auto; background: #f8f9fa; border-right: 1px solid #ddd; }
        .checkpoint-btn { cursor: pointer; padding: 10px; border-radius: 8px; margin-bottom: 5px; }
        .checkpoint-btn:hover { background: #e9ecef; }
        .active-cp { background: #cfe2ff !important; border-left: 4px solid #0d6efd; }
        #loader { display: none; }
    </style>
</head>
<body>
<div class="container-fluid">
    <div class="row">
        <div class="col-md-3 sidebar p-3">
            <h4 th:text="${roadmap.targetJobTitle}">Профессия</h4>

            <div class="mt-3 mb-4">
                <div class="d-flex justify-content-between mb-1">
                    <span class="small fw-bold text-muted">Ваш прогресс</span>
                    <span class="small fw-bold text-primary"
                          th:text="${#numbers.formatDecimal(progress, 1, 0)} + '%'">0%</span>
                </div>
                <div class="progress" style="height: 8px; background-color: #e9ecef;">
                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-success"
                         role="progressbar"
                         th:style="'width: ' + ${progress} + '%'"
                         th:aria-valuenow="${progress}"
                         aria-valuemin="0"
                         aria-valuemax="100"></div>
                </div>
            </div>
            <hr>
            <div th:each="topic : ${roadmap.topics}" class="mb-4">
                <h6 class="text-uppercase text-muted small" th:text="${topic.title}">Топик</h6>
                <div th:each="cp : ${topic.checkpoints}"
                     class="checkpoint-btn d-flex justify-content-between align-items-center"
                     th:onclick="'loadCheckpoint(' + ${cp.id} + ', this)'">
                    <span th:text="${cp.title}">Тема</span>
                    <span class="badge rounded-pill bg-light text-dark" th:text="${cp.status}">Status</span>
                </div>
            </div>
        </div>

        <div class="col-md-9 p-5">
            <div id="loader" class="text-center mt-5">
                <div class="spinner-border text-primary" role="status"></div>
                <p>ИИ готовит контент...</p>
            </div>
            <div id="content-area">
                <div class="text-center mt-5 text-muted">
                    <h3>Выберите тему слева, чтобы начать</h3>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    async function loadCheckpoint(id, element) {
        // Подсветка активного пункта
        document.querySelectorAll('.checkpoint-btn').forEach(el => el.classList.remove('active-cp'));
        if(element) element.classList.add('active-cp');

        const contentArea = document.getElementById('content-area');
        const loader = document.getElementById('loader');

        contentArea.style.opacity = '0.3';
        loader.style.display = 'block';

        try {
            const response = await fetch(`/roadmap/checkpoint/${id}/details`);
            const html = await response.text();
            contentArea.innerHTML = html;

            // ВАЖНО: После вставки HTML запускаем рендеринг задач
            renderTasks();

        } catch (error) {
            contentArea.innerHTML = '<div class="alert alert-danger">Ошибка загрузки данных</div>';
        } finally {
            contentArea.style.opacity = '1';
            loader.style.display = 'none';
        }
    }

    async function generateContent(id) {
        const btn = event.target;
        btn.disabled = true;
        btn.innerHTML = "Генерирую...";

        try {
            const response = await fetch(`/api/roadmap/checkpoint/${id}/fill`, { method: 'POST' });
            if (response.ok) {
                // Перезагружаем фрагмент, чтобы увидеть новые уроки
                loadCheckpoint(id, document.querySelector('.active-cp'));
            }
        } catch (e) {
            alert("Ошибка ИИ");
        }
    }

    // Функция для отрисовки JSON-контента задач
    function renderTasks() {
        document.querySelectorAll('.task-container').forEach(container => {
            const type = container.dataset.taskType;
            // Чтобы избежать ошибок при пустом контенте
            if (!container.dataset.taskContent) return;

            const content = JSON.parse(container.dataset.taskContent);
            const renderArea = container.querySelector('.task-render-area');

            if (type === 'QUIZ') {
                renderArea.innerHTML = `
                    <p class="mb-2">${content.question}</p>
                    <div class="d-flex flex-wrap">
                        ${content.options.map((opt, i) => `
                            <button class="btn btn-outline-primary btn-sm me-2 mb-2"
                                    onclick="checkQuiz(this, ${i === content.correct})">
                                ${opt}
                            </button>
                        `).join('')}
                    </div>
                `;
            } else if (type === 'CODE_SNIPPET') {
                renderArea.innerHTML = `
                    <div class="bg-dark text-light p-3 rounded mb-2">
                        <pre class="mb-0"><code>${content.code}</code></pre>
                    </div>
                    <p class="small"><strong>Задание:</strong> ${content.task}</p>
                `;
            } else if (type === 'PRACTICE') {
                renderArea.innerHTML = `
                    <div class="alert alert-warning py-2 small">
                        <i class="bi bi-tools"></i> Практическое задание
                    </div>
                    <p>${content.instruction || 'Выполните задание на основе изученного материала'}</p>
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" onchange="this.parentElement.style.opacity=0.5">
                        <label class="form-check-label">Пометить как выполненное</label>
                    </div>
                `;
            }
        });
    }

    async function handleDeepen(checkpointId) {
        const input = document.getElementById('deepenRequest');
        const loader = document.getElementById('deepenLoader');
        const userRequest = input.value.trim();

        if (!userRequest) {
            alert("Пожалуйста, введите запрос для углубления темы");
            return;
        }

        loader.style.display = 'block';
        input.disabled = true;

        try {
            const response = await fetch(`/api/roadmap/checkpoint/${checkpointId}/deepen`, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain' }, // Передаем просто строку запроса
                body: userRequest
            });

            if (response.ok) {
                // Чтобы не перезагружать всю страницу, мы просто редиректим
                // пользователя на тот же URL, чтобы обновился скелет слева
                window.location.reload();
            } else {
                alert("Ошибка при создании глубокой темы");
            }
        } catch (e) {
            console.error(e);
            alert("Связь с сервером потеряна");
        } finally {
            loader.style.display = 'none';
            input.disabled = false;
        }
    }

    function checkQuiz(btn, isCorrect) {
        btn.classList.remove('btn-outline-primary');
        btn.classList.add(isCorrect ? 'btn-success' : 'btn-danger');
        if (isCorrect) alert("Правильно!");
    }

    // Вызывай renderTasks() каждый раз после загрузки фрагмента в loadCheckpoint
</script>
</body>
</html>
