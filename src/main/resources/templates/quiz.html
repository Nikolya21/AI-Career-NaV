<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Interview</title>

  <link rel="stylesheet" th:href="@{/css/InterviewPage.css}">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #fff; }
    #root { width: 100%; height: 100%; }
  </style>
</head>
<body>

<div id="root">
  <div style="display: flex; justify-content: center; align-items: center; height: 100vh;">
    Загрузка интерфейса...
  </div>
</div>

<script type="text/babel" th:src="@{/react/InterviewPage.js}"></script>

<script type="text/babel" th:inline="javascript">
  const { useState, useEffect } = React;
  // Используем безопасную подстановку для IDEA
  const userId = [[${userId}]];

  const renderApp = () => {
    const rootElement = document.getElementById('root');
    if (!window.InterviewPage) {
      // Если Babel еще не скомпилировал файл, подождем 100мс
      setTimeout(renderApp, 100);
      return;
    }
    const root = ReactDOM.createRoot(rootElement);
    root.render(<InterviewPage userId={userId} />);
  };

  renderApp();
</script>
</body>
</html>
