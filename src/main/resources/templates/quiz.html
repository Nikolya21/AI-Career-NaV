<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Career Interview</title>

  <link rel="stylesheet" th:href="@{/css/InterviewPage.css}">

  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', sans-serif; background: #fff; }
    #root { width: 100%; height: 100%; }
    .loading-screen { display: flex; justify-content: center; align-items: center; height: 100vh; font-size: 1.2rem; color: #666; }
  </style>
</head>
<body>

<div id="root">
  <div class="loading-screen">
    Загрузка интерфейса интервью...
  </div>
</div>

<script type="text/babel" th:src="@{/react/InterviewPage.js}"></script>

<script type="text/babel" th:inline="javascript">
  const { useState, useEffect } = React;

  // Данные из Spring Model
  const userId = [[${userId}]];
  const vacancyNow = [[${vacancyNow}]]; // Тот самый фикс, которого не хватало

  console.log("Spring Boot Context:", { userId, vacancyNow });

  const renderApp = () => {
    const rootElement = document.getElementById('root');

    // Проверяем, загрузился ли компонент InterviewPage из внешнего файла
    if (typeof window.InterviewPage === 'undefined') {
      console.warn("InterviewPage component not loaded yet, retrying...");
      setTimeout(renderApp, 100);
      return;
    }

    const root = ReactDOM.createRoot(rootElement);
    // Передаем и ID, и Вакансию
    root.render(
            <React.StrictMode>
              <InterviewPage userId={userId} vacancyNow={vacancyNow} />
            </React.StrictMode>
    );
  };

  // Запускаем рендер после загрузки DOM
  if (document.readyState === 'complete') {
    renderApp();
  } else {
    window.addEventListener('load', renderApp);
  }
</script>
</body>
</html>
