<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои пожелания — AI Career Nav</title>
    <style>
        :root {
            --primary-color: #1f2937;
            --secondary-color: #6b7280;
            --accent-color: #3b82f6;
            --accent-strong: #2563eb;
            --success-color: #15803d;
            --error-color: #c2414c;
            --glass: rgba(255, 255, 255, 0.5);
            --glass-strong: rgba(255, 255, 255, 0.7);
            --border: rgba(255, 255, 255, 0.78);
            --shadow: 0 30px 80px rgba(128, 145, 173, 0.2);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #ffffff;  /* чистый белый фон */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 32px;
            color: var(--primary-color);
            position: relative;
        }

        /* Декоративная картинка как полупрозрачный слой */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: url('/css/roadmap/img/beetwean2.jpg') center center / cover no-repeat;
            opacity: 0.12;
            pointer-events: none;
            z-index: 0;
            animation: orb-pulse 12s ease-in-out infinite;
        }

        body::after {
            display: none;
        }

        .shadow-blur {
            position: fixed;
            left: 50%;
            bottom: 56px;
            width: 220px;
            height: 28px;
            transform: translateX(-50%);
            border-radius: 50%;
            background: rgba(140, 146, 160, 0.26);
            filter: blur(10px);
            z-index: -1;
            animation: shadow-pulse 12s ease-in-out infinite;
        }

        .card {
            position: relative;
            z-index: 2;
            background: linear-gradient(180deg, rgba(255,255,255,0.7), rgba(255,255,255,0.42));
            padding: 48px 42px;
            border-radius: 32px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            width: 100%;
            max-width: 680px;   /* увеличенная ширина */
            text-align: center;
            backdrop-filter: blur(34px) saturate(175%);
            -webkit-backdrop-filter: blur(34px) saturate(175%);
            transition: transform 0.35s ease, box-shadow 0.35s ease, border-color 0.35s ease;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(145deg, rgba(255,255,255,0.92), rgba(59, 130, 246, 0.32), rgba(255,255,255,0.3));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.92;
        }

        .card:hover {
            transform: translateY(-3px);
            border-color: rgba(59, 130, 246, 0.72);
            box-shadow: 0 38px 90px rgba(124, 149, 187, 0.22);
        }

        h2 {
            color: var(--primary-color);
            margin-bottom: 16px;
            font-size: 38px;    /* увеличен */
            letter-spacing: -0.03em;
        }

        p {
            color: var(--secondary-color);
            margin-bottom: 32px;
            line-height: 1.55;
            font-size: 18px;    /* увеличен */
        }

        textarea {
            width: 100%;
            height: 200px;       /* чуть выше */
            padding: 18px 20px;
            border: 1px solid rgba(160, 184, 218, 0.38);
            border-radius: 20px;
            resize: vertical;
            font-size: 18px;     /* увеличен */
            transition: 0.28s ease;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            color: var(--primary-color);
            background: rgba(255, 255, 255, 0.68);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.88);
        }

        textarea::placeholder {
            color: rgba(107, 114, 128, 0.78);
            font-size: 16px;
        }

        textarea:focus {
            border-color: rgba(59, 130, 246, 0.9);
            background: rgba(255, 255, 255, 0.84);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.16);
        }

        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 32px;
        }

        .status-panel {
            margin-top: 24px;
            padding: 0;
            border-radius: 18px;
            border: none;
            background: transparent;
            backdrop-filter: none;
            text-align: left;
        }

        button {
            padding: 16px 20px;
            border: 1px solid transparent;
            border-radius: 20px;
            font-size: 17px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, background 0.25s ease;
            box-shadow: 0 12px 26px rgba(120, 145, 180, 0.12);
        }

        button:active { transform: scale(0.98); }

        .btn-save {
            background: linear-gradient(180deg, #ffffff, #f3f7ff);
            border-color: rgba(59, 130, 246, 0.38);
            color: #1f2937;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            color: var(--accent-strong);
            box-shadow: 0 16px 34px rgba(59, 130, 246, 0.18);
        }

        .btn-ai {
            background: linear-gradient(180deg, #ffffff, #eef4ff);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border-color: rgba(59, 130, 246, 0.42);
            color: #1f2937;
        }

        .btn-ai:hover {
            transform: translateY(-2px);
            color: var(--accent-strong);
            box-shadow: 0 16px 34px rgba(59, 130, 246, 0.18);
        }

        .btn-back {
            background: rgba(255,255,255,0.62);
            border-color: rgba(160, 184, 218, 0.32);
            color: #1f2937;
        }

        .btn-back:hover {
            background: rgba(255,255,255,0.82);
            transform: translateY(-2px);
            color: var(--accent-strong);
        }

        .status {
            margin-top: 16px;
            font-size: 16px;    /* увеличен */
            min-height: auto;
            padding: 0;
            border-radius: 12px;
            backdrop-filter: none;
            border: none;
            background: transparent;
        }

        .status--success {
            background: transparent;
            color: var(--success-color);
            border: none;
        }

        .status--error {
            background: transparent;
            color: var(--error-color);
            border: none;
        }

        .status--info {
            background: transparent;
            color: #0c5460;
            border: none;
        }

        .loader {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(59, 130, 246, 0.6);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes orb-pulse {
            0%, 100% { transform: scale(0.98); opacity: 0.9; }
            50% { transform: scale(1.02); opacity: 1; }
        }

        @keyframes shadow-pulse {
            0%, 100% { transform: translateX(-50%) scale(0.96); opacity: 0.42; }
            50% { transform: translateX(-50%) scale(1.04); opacity: 0.62; }
        }

        @media (max-width: 640px) {
            body { padding: 20px; }
            .card { padding: 32px 24px; max-width: 100%; }
            h2 { font-size: 28px; }
            p { font-size: 16px; }
            textarea { font-size: 16px; height: 160px; }
            button { padding: 14px 18px; font-size: 15px; }
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>

<div class="shadow-blur"></div>

<div class="card">
    <h2>🎯 Чего вы хотите от карьеры?</h2>
    <p>Опишите ваши цели, желаемый стек или условия работы. Мы используем это для подбора вакансий.</p>

    <label class="sr-only" for="wishesInput">Ваши пожелания к карьере</label>
    <textarea id="wishesInput" placeholder="Например: Хочу перейти из системного администрирования в Java-разработку, готов уделять учебе 10 часов в неделю..."></textarea>

    <div class="button-stack">
        <button class="btn-save" onclick="saveWishes()">💾 Сохранить и продолжить</button>
        <button class="btn-ai" onclick="startAIConsultation()">
            ✨ Помощь ИИ-ассистента
        </button>
        <button class="btn-back" onclick="goBack()">
            ← Вернуться в личный кабинет
        </button>
    </div>

    <div class="status-panel">
        <div id="status" class="status"></div>
    </div>
</div>

<script th:inline="javascript">
    const userId = /*[[${userId}]]*/ null;

    console.log("=== WISHES PAGE DEBUG ===");
    console.log("User ID from session:", userId);

    async function saveWishes() {
        const input = document.getElementById('wishesInput');
        const statusDiv = document.getElementById('status');
        const message = input.value.trim();

        if (!message) {
            statusDiv.className = "status status--error";
            statusDiv.innerText = "⚠️ Пожалуйста, введите текст ваших пожеланий.";
            return;
        }

        if (!userId) {
            statusDiv.className = "status status--error";
            statusDiv.innerText = "❌ Ошибка: ID пользователя не найден. Перезайдите в систему.";
            return;
        }

        statusDiv.className = "status status--info";
        statusDiv.innerHTML = '<span class="loader"></span> Сохранение...';

        try {
            const url = `/api/wishes?userId=${userId}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ wishesMessage: message })
            });

            if (!response.ok) {
                statusDiv.className = "status status--error";
                statusDiv.innerText = "❌ Ошибка сервера при сохранении";
                return;
            }

            statusDiv.className = "status status--success";
            statusDiv.innerText = "✅ Успешно сохранено! Перенаправляем...";
            setTimeout(() => window.location.href = "/choose-vacancy", 1500);

        } catch (error) {
            statusDiv.className = "status status--error";
            statusDiv.innerText = "❌ " + error.message;
        }
    }

    function startAIConsultation() {
        if (!userId) {
            alert("Пожалуйста, войдите в систему");
            return;
        }
        window.location.href = `/dialogs/chat?userId=${userId}&type=INFORMATION`;
    }

    function goBack() {
        window.location.href = "/personal-cabinet";
    }
</script>

</body>
</html>
