# =============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# =============================================================================

# Application name
spring.application.name=AI Career Navigator

# =============================================================================
# DATABASE CONFIGURATION (PostgreSQL)
# =============================================================================

# PostgreSQL connection
spring.datasource.url=jdbc:${database.url}
spring.datasource.username=${database.username}
spring.datasource.password=${database.password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${database.schema}
spring.jpa.properties.hibernate.format_sql=true

# Connection pool settings (HikariCP)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# =============================================================================
# DATABASE CONNECTION PARAMETERS (your existing variables)
# =============================================================================

database.url=postgresql://localhost:5432/aicareer_db
database.username=postgres
database.password=KRMSnoQRnx
database.schema=aicareer

# =============================================================================
# APPLICATION SETTINGS
# =============================================================================

app.logging.level=${APP_LOGGING_LEVEL:INFO}
app.name=${APP_NAME:AiCareer}
app.version=${APP_VERSION:1.0.0}

# =============================================================================
# LOGGING CONFIGURATION
# =============================================================================

logging.level.com.aicareer=${app.logging.level}
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# =============================================================================
# EXTERNAL SERVICES - HeadHunter API
# =============================================================================

hh.api.base-url=https://api.hh.ru
hh.api.user-agent=AI-Career-Navigator/1.0 (your-email@example.com)
hh.api.timeout-ms=10000
hh.api.max-in-memory-size=2MB

# =============================================================================
