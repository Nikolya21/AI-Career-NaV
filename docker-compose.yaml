services:
  java-db:
    image: 'postgres:latest'
    container_name: java-postgres-main
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    networks:
      - shared-network

  redis:
    image: 'redis:latest'
    container_name: redis_cache
    ports:
      - '6379:6379'
    networks:
      - shared-network

  java-app:
    build: .
    container_name: java-spring-app
    user: root
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://java-db:5432/mydatabase
      - PYTHON_SERVICE_URL=http://python-fastapi-service:8000
    depends_on:
      - java-db
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Используем внутреннее имя тома, которое мапится на внешнее my_global_code_storage
      - temp_code_storage:/codes:rw
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: ai-career-network

volumes:
  temp_code_storage:
    name: my_global_code_storage  # СТРОГО ЭТО ИМЯ используем в Java
    driver: local