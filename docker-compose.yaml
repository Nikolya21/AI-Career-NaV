services:
  java-db:
    image: 'postgres:latest'
    container_name: java-postgres-main
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    networks:
      - shared-network

  redis:
    image: 'redis:latest'
    container_name: redis_cache
    ports:
      - '6379:6379'
    networks:
      - shared-network

  # Сервис на Python для ML
  python-fastapi-service:
    # ВНИМАНИЕ: Замени абсолютный путь на относительный, если перенесешь папку!
    # Например: build: ./mlIntereview2
    build: C:\Users\aweeexo\PycharmProjects\mlIntereview2
    container_name: python-ai-service
    ports:
      - "5000:5000"
    networks:
      - shared-network
    volumes:
      - my_global_code_storage:/codes:rw

  java-app:
    build: .
    container_name: java-spring-app
    user: root
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://java-db:5432/mydatabase
      - PYTHON_SERVICE_URL=http://python-fastapi-service:5000
    depends_on:
      - java-db
      - python-fastapi-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Используем единое имя тома
      - my_global_code_storage:/codes:rw
      # Убрано дублирование статики и шаблонов
      - ./src/main/resources/static:/app/src/main/resources/static
      - ./src/main/resources/templates:/app/src/main/resources/templates
    networks:
      - shared-network

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - shared-network
    volumes:
      - grafana-storage:/var/lib/grafana

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    networks:
      - shared-network

networks:
  shared-network:
    name: ai-career-network
    # Убрано external: true, теперь Docker создаст сеть сам

volumes:
  grafana-storage:
  my_global_code_storage:
  # Том создастся автоматически, путаница с temp_code_storage убрана