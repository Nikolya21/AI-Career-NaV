services:
  java-db:
    image: 'postgres:latest'
    container_name: java-postgres-main
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
    networks:
      - shared-network

  redis:
    image: 'redis:latest'
    container_name: redis_cache
    ports:
      - '6379:6379'
    networks:
      - shared-network

  # Твой сервис на Python для ML (распознавание аудио и видео)
  python-fastapi-service:
    build: C:\Users\aweeexo\PycharmProjects\mlIntereview2
    container_name: python-ai-service
    ports:
      - "5000:5000"
    networks:
      - shared-network
    volumes:
      - my_global_code_storage:/codes:rw

  # Если у тебя есть еще один "старый" Python сервис на 8000, можешь добавить его сюда же ниже
  # python-old-service:
  #   ...

  java-app:
    build: .
    container_name: java-spring-app
    user: root
    ports:
      - "8086:8086"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://java-db:5432/mydatabase
      # Адрес для Java, хотя в контроллерах мы прописали его напрямую
      - PYTHON_SERVICE_URL=http://python-fastapi-service:5000
    depends_on:
      - java-db
      - python-fastapi-service
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - temp_code_storage:/codes:rw
      - ./src/main/resources/static:/app/src/main/resources/static
      - ./src/main/resources/templates:/app/src/main/resources/templates
    networks:
      - shared-network

networks:
  shared-network:
    external: true
    name: ai-career-network

volumes:
  temp_code_storage:
    name: my_global_code_storage
    driver: local
  my_global_code_storage:
    external: true